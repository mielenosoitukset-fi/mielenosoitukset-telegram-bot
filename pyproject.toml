[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[project]
name = "mielenosoitukset-telegram-bot"
version = "0.1.0"
description = "Telegram bot for mielenosoitukset.fi - subscribe to demos by city, org, or chain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21,<22",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "pydantic-settings>=2,<3",
    "pydantic>=2,<3",
]

[project.scripts]
mielenosoitukset-bot = "bot.main:main"
